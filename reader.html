<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marginalia — Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    :root {
      --ink: #171b21;
      --ink-soft: #1f2530;
      --paper: #f2e9d3;
      --paper-dim: #e7dcc0;
      --brass: #b8923f;
      --brass-bright: #d4ac57;
      --moss: #48594f;
      --text-dark: #2a241c;
      --text-light: #ece4d1;
      --text-muted: #9aa2ad;
      --radius: 2px;
      
      /* reading theme defaults (paper) */
      --read-bg: #f2e9d3;
      --read-fg: #2a241c;
      --read-fg-soft: #5c5342;
      --read-line: rgba(42, 36, 28, .12);
    }
    
    * {
      box-sizing: border-box;
    }
    
    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }
    
    body {
      margin: 0;
      background: var(--ink);
      color: var(--text-light);
      font-family: 'Work Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    /* ---------- Themes applied to the reading surface ---------- */
    body.theme-paper {
      --read-bg: #f2e9d3;
      --read-fg: #2a241c;
      --read-fg-soft: #5c5342;
      --read-line: rgba(42, 36, 28, .12);
    }
    
    body.theme-sepia {
      --read-bg: #ecdcb8;
      --read-fg: #4a3a22;
      --read-fg-soft: #7a6743;
      --read-line: rgba(74, 58, 34, .18);
    }
    
    body.theme-dark {
      --read-bg: #14171c;
      --read-fg: #d9dee6;
      --read-fg-soft: #9aa2ad;
      --read-line: rgba(217, 222, 230, .12);
    }
    
    /* ---------- Top chrome (always dark/brass, matches catalog) ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--ink);
      border-bottom: 1px solid rgba(184, 146, 63, .25);
    }
    
    .progress-track {
      height: 3px;
      background: rgba(184, 146, 63, .15);
      width: 100%;
    }
    
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--brass-bright);
      transition: width .15s ease;
    }
    
    .topbar-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: .85rem 1rem;
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    
    .back-link {
      color: var(--brass-bright);
      text-decoration: none;
      font-family: 'Space Mono', monospace;
      font-size: .78rem;
      letter-spacing: .04em;
      display: flex;
      align-items: center;
      gap: .35rem;
      flex-shrink: 0;
      padding: .3rem .2rem;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }
    
    .topbar-title {
      flex: 1;
      min-width: 0;
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: .95rem;
      color: var(--text-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .progress-pct {
      font-family: 'Space Mono', monospace;
      font-size: .72rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    
    .settings-btn {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(184, 146, 63, .35);
      background: transparent;
      color: var(--brass-bright);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: background .15s ease, transform .3s ease;
    }
    
    .settings-btn:hover {
      background: rgba(184, 146, 63, .12);
    }
    
    .settings-btn.open {
      transform: rotate(35deg);
    }
    
    /* ---------- Settings drawer ---------- */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .35);
      z-index: 29;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    
    .drawer-backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }
    
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: min(320px, 88vw);
      background: var(--ink-soft);
      border-left: 1px solid rgba(184, 146, 63, .25);
      z-index: 30;
      transform: translateX(100%);
      transition: transform .25s ease;
      overflow-y: auto;
      padding: 1.4rem 1.3rem 2rem;
    }
    
    .drawer.open {
      transform: translateX(0);
    }
    
    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      margin: 0 0 1.2rem;
    }
    
    .drawer h2 {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 1.15rem;
      margin: 0;
      color: var(--text-light);
    }
    
    .drawer-close {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid rgba(184, 146, 63, .35);
      background: transparent;
      color: var(--brass-bright);
      cursor: pointer;
      font-size: 1.05rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s ease;
    }
    
    .drawer-close:hover {
      background: rgba(184, 146, 63, .12);
    }
    
    .drawer-close:focus-visible {
      outline: 2px solid var(--brass-bright);
      outline-offset: 2px;
    }
    
    .setting-group {
      margin-bottom: 1.3rem;
    }
    
    .setting-label {
      font-family: 'Space Mono', monospace;
      font-size: .68rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--brass-bright);
      margin-bottom: .55rem;
      display: block;
    }
    
    .option-row {
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
    }
    
    .opt-btn {
      flex: 1;
      font-family: 'Work Sans', sans-serif;
      font-size: .82rem;
      background: rgba(255, 255, 255, .04);
      color: var(--text-light);
      border: 1px solid rgba(184, 146, 63, .25);
      border-radius: var(--radius);
      padding: .45rem .7rem;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    
    .opt-btn:hover {
      background: rgba(184, 146, 63, .1);
    }
    
    .opt-btn.active {
      background: var(--brass);
      border-color: var(--brass);
      color: var(--ink);
      font-weight: 600;
    }
    
    .size-row {
      display: flex;
      align-items: center;
      gap: .7rem;
    }
    
    .size-row .opt-btn {
      width: 38px;
      text-align: center;
      padding: .45rem 0;
    }
    
    .size-value {
      font-family: 'Space Mono', monospace;
      font-size: .78rem;
      color: var(--text-muted);
      min-width: 10ch;
      text-align: center;
    }
    
    .reset-btn {
      width: 100%;
      margin-top: .4rem;
      font-family: 'Space Mono', monospace;
      font-size: .75rem;
      letter-spacing: .05em;
      text-transform: uppercase;
      background: transparent;
      color: var(--text-muted);
      border: 1px dashed rgba(184, 146, 63, .35);
      padding: .6rem;
      border-radius: var(--radius);
      cursor: pointer;
    }
    
    .reset-btn:hover {
      color: var(--brass-bright);
      border-color: var(--brass-bright);
    }
    
    /* ---------- Reading surface ---------- */
    .reader-surface {
      background: var(--read-bg);
      min-height: calc(100vh - 45px);
      transition: background .2s ease, color .2s ease;
    }
    
    .reader-page {
      max-width: 700px;
      margin: 0 auto;
      padding: 3rem 1.4rem 3rem;
      color: var(--read-fg);
    }
    
    .chapter-eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--read-fg-soft);
      margin-bottom: .5rem;
    }
    
    .chapter-title {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.7rem;
      margin: 0 0 2rem;
      color: var(--read-fg);
    }
    
    .chapter-body {
      font-size: 1.0625rem;
      /* overridden by JS via --font-size */
      font-size: var(--font-size, 1.0625rem);
      line-height: 1.75;
      text-align: var(--text-align, left);
    }
    
    .chapter-body.font-serif {
      font-family: 'Literata', Georgia, serif;
    }
    
    .chapter-body.font-sans {
      font-family: 'Atkinson Hyperlegible', 'Work Sans', sans-serif;
    }
    
    .chapter-body.font-mono {
      font-family: 'Space Mono', monospace;
    }
    
    .chapter-body p {
      margin: 0 0 1.3em;
    }
    
    .chapter-body p:first-of-type::first-letter {
      font-family: 'Fraunces', serif;
      font-size: 2.6em;
      float: left;
      line-height: .85;
      padding: .05em .08em 0 0;
      font-weight: 600;
    }
    
    .chapter-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px dashed var(--read-line);
    }
    
    .nav-btn {
      font-family: 'Space Mono', monospace;
      font-size: .78rem;
      letter-spacing: .04em;
      background: transparent;
      border: 1px solid var(--read-line);
      color: var(--read-fg);
      padding: .6rem 1rem;
      border-radius: var(--radius);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
    }
    
    .nav-btn:hover {
      border-color: var(--brass);
    }
    
    .nav-btn[disabled] {
      opacity: .35;
      cursor: default;
      pointer-events: none;
    }
    
    .chapter-select {
      font-family: 'Space Mono', monospace;
      font-size: .65rem;
      background: transparent;
      border: 1px solid var(--read-line);
      color: var(--read-fg-soft);
      padding: .5rem .85rem;
      border-radius: var(--radius);
      max-width: 42vw;
    }
    
    .state-box {
      max-width: 700px;
      margin: auto;
      padding: 1.4rem;
      font-family: 'Space Mono', monospace;
      font-size: .88rem;
      color: var(--read-fg-soft);
      text-align: center;
    }
    
    .state-box .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brass-bright);
      display: inline-block;
      animation: pulse 1.4s ease-in-out infinite;
    }
    
    @keyframes pulse {
      
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }
      
      50% {
        opacity: .35;
        transform: scale(.7);
      }
    }
    
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: .01ms !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body class="theme-paper">
  
  <div class="topbar">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="topbar-inner">
      <a href="index.html" class="back-link" id="backLink">archive</a>
      <div class="topbar-title" id="topbarTitle">Loading…</div>
      <div class="progress-pct" id="progressPct">0%</div>
      <button class="settings-btn" id="settingsBtn" aria-label="Reading settings" aria-expanded="false">&#9881;</button>
    </div>
  </div>
  
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Reading settings">
    <div class="drawer-head">
      <h2>Reading settings</h2>
      <button class="drawer-close" id="drawerCloseBtn" aria-label="Close settings">&#10005;</button>
    </div>
    
    <div class="setting-group">
      <span class="setting-label">Font</span>
      <div class="option-row" id="fontRow" data-key="font">
        <button class="opt-btn" data-value="serif">Serif</button>
        <button class="opt-btn" data-value="sans">Sans</button>
        <button class="opt-btn" data-value="mono">Mono</button>
      </div>
    </div>
    
    <div class="setting-group">
      <span class="setting-label">Text size</span>
      <div class="size-row">
        <button class="opt-btn" id="sizeDown" aria-label="Decrease text size">A-</button>
        <span class="size-value" id="sizeValue">17</span>
        <button class="opt-btn" id="sizeUp" aria-label="Increase text size">A+</button>
      </div>
    </div>
    
    <div class="setting-group">
      <span class="setting-label">Alignment</span>
      <div class="option-row" id="alignRow" data-key="align">
        <button class="opt-btn" data-value="left">Left</button>
        <button class="opt-btn" data-value="justify">Justify</button>
      </div>
    </div>
    
    <div class="setting-group">
      <span class="setting-label">Theme</span>
      <div class="option-row" id="themeRow" data-key="theme">
        <button class="opt-btn" data-value="paper">Paper</button>
        <button class="opt-btn" data-value="sepia">Sepia</button>
        <button class="opt-btn" data-value="dark">Dark</button>
      </div>
    </div>
    
    <button class="reset-btn" id="resetBtn">Reset to defaults</button>
  </aside>
  
  <div class="reader-surface" id="readerSurface">
    <div class="state-box" id="stateBox"><span class="dot"></span> Opening the book…</div>
  </div>
  
  <script>
    (function() {
      const params = new URLSearchParams(location.search);
      const bookId = params.get('id');
      
      const SETTINGS_KEY = 'marginalia:settings';
      const DEFAULT_SETTINGS = { font: 'serif', size: 17, align: 'left', theme: 'paper' };
      const SIZE_MIN = 14,
        SIZE_MAX = 26,
        SIZE_STEP = 1;
      
      const el = {
        surface: document.getElementById('readerSurface'),
        stateBox: document.getElementById('stateBox'),
        topbarTitle: document.getElementById('topbarTitle'),
        progressFill: document.getElementById('progressFill'),
        progressPct: document.getElementById('progressPct'),
        settingsBtn: document.getElementById('settingsBtn'),
        drawerCloseBtn: document.getElementById('drawerCloseBtn'),
        backLink: document.getElementById('backLink'),
        drawer: document.getElementById('drawer'),
        backdrop: document.getElementById('drawerBackdrop'),
        fontRow: document.getElementById('fontRow'),
        alignRow: document.getElementById('alignRow'),
        themeRow: document.getElementById('themeRow'),
        sizeValue: document.getElementById('sizeValue'),
        sizeUp: document.getElementById('sizeUp'),
        sizeDown: document.getElementById('sizeDown'),
        resetBtn: document.getElementById('resetBtn'),
      };
      
      let settings = loadSettings();
      let manifest = null;
      let bookMeta = null;
      let chapterIndex = 0;
      let saveTimer = null;
      let zip = null; // the loaded JSZip archive for this book
      
      function naturalSort(a, b) {
        return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
      }
      
      // Escape any string before it goes into innerHTML, so chapter titles
      // and chapter text (which come from the book's zip/manifest) can
      // never be interpreted as markup.
      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, ch => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        } [ch]));
      }
      
      // ---------- settings persistence ----------
      function loadSettings() {
        try {
          const raw = localStorage.getItem(SETTINGS_KEY);
          if (!raw) return { ...DEFAULT_SETTINGS };
          return { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
        } catch { return { ...DEFAULT_SETTINGS }; }
      }
      
      function saveSettings() {
        try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {}
      }
      
      function applySettings() {
        document.body.className = 'theme-' + settings.theme;
        document.documentElement.style.setProperty('--font-size', settings.size + 'px');
        document.documentElement.style.setProperty('--text-align', settings.align);
        
        const body = document.querySelector('.chapter-body');
        if (body) {
          body.classList.remove('font-serif', 'font-sans', 'font-mono');
          body.classList.add('font-' + settings.font);
        }
        
        [el.fontRow, el.alignRow, el.themeRow].forEach(row => {
          row.querySelectorAll('.opt-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.value === settings[row.dataset.key]);
          });
        });
        el.sizeValue.textContent = settings.size;
      }
      
      function updateSetting(key, value) {
        settings[key] = value;
        saveSettings();
        applySettings();
      }
      
      el.fontRow.addEventListener('click', e => {
        const btn = e.target.closest('.opt-btn');
        if (!btn) return;
        updateSetting('font', btn.dataset.value);
      });
      el.alignRow.addEventListener('click', e => {
        const btn = e.target.closest('.opt-btn');
        if (!btn) return;
        updateSetting('align', btn.dataset.value);
      });
      el.themeRow.addEventListener('click', e => {
        const btn = e.target.closest('.opt-btn');
        if (!btn) return;
        updateSetting('theme', btn.dataset.value);
      });
      el.sizeUp.addEventListener('click', () => {
        updateSetting('size', Math.min(SIZE_MAX, settings.size + SIZE_STEP));
      });
      el.sizeDown.addEventListener('click', () => {
        updateSetting('size', Math.max(SIZE_MIN, settings.size - SIZE_STEP));
      });
      el.resetBtn.addEventListener('click', () => {
        settings = { ...DEFAULT_SETTINGS };
        saveSettings();
        applySettings();
      });
      
      function openDrawer() {
        el.drawer.classList.add('open');
        el.backdrop.classList.add('visible');
        el.settingsBtn.classList.add('open');
        el.settingsBtn.setAttribute('aria-expanded', 'true');
      }
      
      function closeDrawer() {
        el.drawer.classList.remove('open');
        el.backdrop.classList.remove('visible');
        el.settingsBtn.classList.remove('open');
        el.settingsBtn.setAttribute('aria-expanded', 'false');
      }
      el.settingsBtn.addEventListener('click', () => {
        el.drawer.classList.contains('open') ? closeDrawer() : openDrawer();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && el.drawer.classList.contains('open')) closeDrawer();
      });
      el.backdrop.addEventListener('click', closeDrawer);
      el.drawerCloseBtn.addEventListener('click', closeDrawer);
      
      // ---------- progress persistence ----------
      function progressKey(id) { return 'marginalia:progress:' + id; }
      
      function loadProgress(id) {
        try {
          const raw = localStorage.getItem(progressKey(id));
          return raw ? JSON.parse(raw) : null;
        } catch { return null; }
      }
      
      function saveProgress(id, data) {
        try { localStorage.setItem(progressKey(id), JSON.stringify(data)); } catch {}
      }
      
      function scrollFraction() {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        if (max <= 0) return 1;
        return Math.min(1, Math.max(0, window.scrollY / max));
      }
      
      function overallPercent() {
        const total = manifest.chapters.length;
        const pct = ((chapterIndex + scrollFraction()) / total) * 100;
        return Math.min(100, Math.max(0, pct));
      }
      
      function updateProgressUI() {
        const pct = overallPercent();
        el.progressFill.style.width = pct + '%';
        el.progressPct.textContent = Math.round(pct) + '%';
      }
      
      function persistProgress() {
        saveProgress(bookId, {
          chapterIndex,
          scrollFraction: scrollFraction(),
          updatedAt: Date.now()
        });
      }
      
      function onScroll() {
        updateProgressUI();
        clearTimeout(saveTimer);
        saveTimer = setTimeout(persistProgress, 250);
      }
      
      // ---------- rendering ----------
      function renderState(message) {
        el.surface.innerHTML = `<div class="state-box"><span class="dot"></span> ${message}</div>`;
      }
      
      function renderError(message) {
        el.surface.innerHTML = `<div class="state-box">${escapeHtml(message)}<br><br>
        <a href="index.html" class="nav-btn">Back to the archive</a></div>`;
      }
      
      function paragraphize(text) {
        return text
          .split(/\n{2,}/)
          .map(p => p.trim())
          .filter(Boolean)
          .map(p => `<p>${escapeHtml(p).replace(/\n/g, ' ')}</p>`)
          .join('');
      }
      
      async function loadChapter(index, restoreScroll) {
        chapterIndex = Math.min(Math.max(index, 0), manifest.chapters.length - 1);
        const chapter = manifest.chapters[chapterIndex];
        renderState('Turning the page…');
        
        let text;
        try {
          const entry = zip.file(chapter.file);
          if (!entry) throw new Error(`"${chapter.file}" not found in the zip`);
          text = await entry.async('string');
        } catch (err) {
          renderError(`This chapter couldn't be loaded (${err.message}).`);
          return;
        }
        
        const total = manifest.chapters.length;
        const options = manifest.chapters.map((c, i) =>
          `<option value="${i}" ${i === chapterIndex ? 'selected' : ''}>${escapeHtml(c.title || ('Chapter ' + (i + 1)))}</option>`
        ).join('');
        
        el.surface.innerHTML = `
        <div class="reader-page">
          <div class="chapter-eyebrow">Chapter ${chapterIndex + 1} of ${total}</div>
          <h1 class="chapter-title">${escapeHtml(chapter.title || ('Chapter ' + (chapterIndex + 1)))}</h1>
          <div class="chapter-body font-${settings.font}">${paragraphize(text)}</div>
          <div class="chapter-nav">
            <button class="nav-btn" id="prevBtn" ${chapterIndex === 0 ? 'disabled' : ''}>Prev</button>
            <select class="chapter-select" id="chapterSelect">${options}</select>
            <button class="nav-btn" id="nextBtn" ${chapterIndex === total - 1 ? 'disabled' : ''}>Next</button>
          </div>
        </div>`;
        
        applySettings();
        
        document.getElementById('prevBtn').addEventListener('click', () => {
          window.scrollTo(0, 0);
          loadChapter(chapterIndex - 1, false);
        });
        document.getElementById('nextBtn').addEventListener('click', () => {
          window.scrollTo(0, 0);
          loadChapter(chapterIndex + 1, false);
        });
        document.getElementById('chapterSelect').addEventListener('change', (e) => {
          window.scrollTo(0, 0);
          loadChapter(parseInt(e.target.value, 10), false);
        });
        
        if (restoreScroll) {
          const saved = loadProgress(bookId);
          if (saved && saved.chapterIndex === chapterIndex) {
            const max = document.documentElement.scrollHeight - window.innerHeight;
            window.scrollTo(0, max * (saved.scrollFraction || 0));
          }
        } else {
          window.scrollTo(0, 0);
        }
        
        updateProgressUI();
        persistProgress();
      }
      
      async function init() {
        if (!bookId) {
          renderError('No book was specified.');
          return;
        }
        
        try {
          const booksRes = await fetch('books.json', { cache: 'no-store' }).catch(() => null);
          if (booksRes && booksRes.ok) {
            const books = await booksRes.json();
            bookMeta = books.find(b => String(b.id) === String(bookId)) || null;
          }
          const fallbackTitle = bookMeta ? bookMeta.title : `Book ${bookId}`;
          
          renderState('Unpacking the book…');
          
          const zipPath = (bookMeta && bookMeta.zip) ? bookMeta.zip : `books/${bookId}.zip`;
          
          let zipRes;
          try {
            zipRes = await fetch(zipPath); // default caching: a book's zip rarely changes, so let repeat visits use the cache
            if (!zipRes.ok) throw new Error(`HTTP ${zipRes.status}`);
          } catch (err) {
            el.topbarTitle.textContent = fallbackTitle;
            renderError(`"${fallbackTitle}" isn't on the archive yet — ${zipPath} couldn't be found.`);
            return;
          }
          
          const buffer = await zipRes.arrayBuffer();
          zip = await JSZip.loadAsync(buffer);
          
          // If the zip includes its own manifest.json, use it for titles/order.
          const manifestEntry = zip.file('manifest.json');
          if (manifestEntry) {
            manifest = JSON.parse(await manifestEntry.async('string'));
          } else {
            const chapterFiles = Object.keys(zip.files)
              .filter(name => /\.txt$/i.test(name) && !zip.files[name].dir)
              .sort(naturalSort);
            
            if (chapterFiles.length === 0) {
              el.topbarTitle.textContent = fallbackTitle;
              renderError(`"${fallbackTitle}"'s zip doesn't contain any .txt chapter files.`);
              return;
            }
            
            manifest = {
              title: fallbackTitle,
              chapters: chapterFiles.map((file, i) => ({ file, title: `Chapter ${i + 1}` }))
            };
          }
          
          const title = manifest.title || fallbackTitle;
          el.topbarTitle.textContent = title;
          
          if (!Array.isArray(manifest.chapters) || manifest.chapters.length === 0) {
            renderError(`"${title}" doesn't have any chapters yet.`);
            return;
          }
          
          applySettings();
          
          const saved = loadProgress(bookId);
          const startIndex = saved ? saved.chapterIndex : 0;
          await loadChapter(startIndex, true);
          
          window.addEventListener('scroll', onScroll, { passive: true });
          window.addEventListener('beforeunload', persistProgress);
        } catch (err) {
          renderError(`Something went wrong (${err.message}).`);
        }
      }
      
      applySettings();
      init();
    })();
  </script>
</body>
