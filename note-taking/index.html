<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F4EF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inkbox">
  <title>Inkbox — Notes</title>
  <meta name="description" content="A fast, private, offline notes app. Folders, notes, search, and export — all stored on your device.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231F6F5C'/%3E%3Cpath d='M28 30h44M28 46h44M28 62h30' stroke='%23F6F4EF' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>

<body>
  
  <div id="shell-bg">
    <div id="app" data-theme="light">
      
      <!-- ===================== LIST VIEW ===================== -->
      <div id="list-view">
        <header class="appbar" id="appbar">
          <div class="appbar-row" id="appbar-row"><!-- filled by JS --></div>
          <div class="searchbar-wrap" id="searchbar-wrap">
            <div class="searchbar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input id="search-input" type="text" placeholder="Search notes and folders" autocomplete="off">
              <button class="clear-btn" id="search-clear" aria-label="Clear search" hidden>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4">
                  <line x1="18" y1="6" x2="6" y2="18" />
                  <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
              </button>
            </div>
          </div>
        </header>
        
        <main class="content" id="content"><!-- filled by JS --></main>
        
        <div class="bottom-bar">
          <button class="bottom-btn" id="btn-new-folder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" />
              <line x1="12" y1="11" x2="12" y2="15" />
              <line x1="10" y1="13" x2="14" y2="13" />
            </svg>
            New folder
          </button>
          <button class="bottom-btn primary" id="btn-new-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M5 12h14" />
            </svg>
            New note
          </button>
        </div>
      </div>
      
      <!-- ===================== EDITOR VIEW ===================== -->
      <div id="editor-view">
        <div class="editor-header">
          <button class="icon-btn" id="btn-editor-back" aria-label="Back to list">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <span class="save-pill" id="save-pill"><span class="dot"></span><span id="save-pill-text">Saved</span></span>
          <span class="spacer"></span>
          <button class="icon-btn" id="btn-editor-pin" aria-label="Pin note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 17v5M8 3h8l-1 6 3 3v2H6v-2l3-3-1-6Z" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-editor-menu" aria-label="More options">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="5" r="1.9" />
              <circle cx="12" cy="12" r="1.9" />
              <circle cx="12" cy="19" r="1.9" />
            </svg>
          </button>
        </div>
        <div class="editor-scroll">
          <div class="editor-inner">
            <input id="note-title" type="text" placeholder="Untitled note" autocomplete="off" maxlength="200">
            <div class="editor-meta">
              <span id="editor-timestamp">Edited just now</span>
              <span id="editor-wordcount">0 words</span>
              <button class="folder-chip" id="editor-folder-chip" type="button">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z" />
                </svg>
                <span id="editor-folder-name">Home</span>
              </button>
            </div>
            <textarea id="note-body" placeholder="Start writing…"></textarea>
          </div>
        </div>
      </div>
      
      <!-- ===================== OVERLAYS (modals / sheets) ===================== -->
      <div class="overlay" id="overlay">
        <div class="sheet" id="sheet"></div>
      </div>
      
      <!-- ===================== TOASTS ===================== -->
      <div id="toast-region"></div>
      
    </div>
  </div>
  <script src="index.js" defer></script>
</body>

</html>
