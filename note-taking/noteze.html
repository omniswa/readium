<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Minimal Notes</title>
  
  <!-- Inter Font & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- JSZip for exporting folders and bulk notes as ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <style>
    /* --- CSS Variables & Design System --- */
    :root {
      --bg-primary: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      --border-color: #e2e8f0;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --accent: #3b82f6;
      --danger: #ef4444;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
      --shadow-float: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
      --header-height: 64px;
      --bottom-bar-height: 76px;
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #090d16;
        --bg-surface: #111827;
        --bg-card: #151e32;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --text-subtle: #64748b;
        --border-color: #1e293b;
        --primary: #f8fafc;
        --primary-hover: #e2e8f0;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
      }
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    input,
    textarea {
      user-select: text;
    }
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* Mobile Container Frame */
    .app-viewport {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      background-color: var(--bg-surface);
      display: flex;
      flex-direction: column;
      position: relative;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.02);
    }
    
    /* --- Header --- */
    header {
      height: var(--header-height);
      position: sticky;
      top: 0;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 20;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .back-btn {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-main);
      padding: 6px;
      border-radius: var(--radius-sm);
    }
    
    .brand-logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .brand-logo i {
      stroke-width: 2.5;
    }
    
    .header-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      max-width: 160px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    
    .icon-btn:active {
      transform: scale(0.92);
      background-color: var(--bg-primary);
      color: var(--text-main);
    }
    
    /* --- Search & Filter Bar --- */
    .search-section {
      padding: 12px 18px 6px;
    }
    
    .search-box {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 8px;
      color: var(--text-muted);
    }
    
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 0.9rem;
      color: var(--text-main);
      font-family: inherit;
    }
    
    /* --- Card List Container --- */
    main {
      flex: 1;
      padding: 12px 18px 100px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    
    /* --- Hand-drawn Inspired Modern Cards --- */
    .item-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.15s ease, border-color 0.15s ease;
      overflow: hidden;
    }
    
    .item-card:active {
      transform: scale(0.985);
      box-shadow: none;
    }
    
    .item-card.pinned {
      border-color: var(--accent);
    }
    
    .card-top {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    
    .card-info {
      flex: 1;
      min-width: 0;
    }
    
    .card-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .pin-badge {
      color: var(--accent);
      width: 14px;
      height: 14px;
      display: inline-flex;
    }
    
    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .card-preview {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .card-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .card-bottom-bar {
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-primary);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
    }
    
    .card-meta-date {
      color: var(--text-subtle);
      font-weight: 500;
    }
    
    .card-badge {
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 6px;
    }
    
    .badge-note {
      background: rgba(59, 130, 246, 0.1);
      color: var(--accent);
    }
    
    .badge-folder {
      background: rgba(245, 158, 11, 0.12);
      color: #d97706;
    }
    
    /* --- Empty State --- */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
      color: var(--text-subtle);
      gap: 12px;
    }
    
    .empty-state i {
      stroke-width: 1.5;
      color: var(--text-muted);
    }
    
    /* --- Fixed Bottom Action Bar --- */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 500px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      padding: 12px 18px calc(12px + var(--safe-bottom));
      display: flex;
      gap: 12px;
      box-shadow: var(--shadow-float);
      z-index: 20;
    }
    
    .btn {
      flex: 1;
      padding: 13px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      transition: all 0.15s ease;
    }
    
    .btn:active {
      transform: scale(0.97);
    }
    
    .btn-secondary {
      background-color: var(--bg-primary);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    
    .btn-primary {
      background-color: var(--primary);
      color: var(--bg-surface);
    }
    
    /* --- Slide-Over Editor View --- */
    .editor-screen {
      position: fixed;
      inset: 0;
      background-color: var(--bg-surface);
      z-index: 50;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      max-width: 500px;
      margin: 0 auto;
    }
    
    .editor-screen.active {
      transform: translateY(0);
    }
    
    .editor-header {
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
    }
    
    .editor-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 20px;
      overflow-y: auto;
      gap: 12px;
    }
    
    .note-title-input {
      font-size: 1.4rem;
      font-weight: 700;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-main);
      font-family: inherit;
    }
    
    .note-content-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-main);
      font-size: 1rem;
      line-height: 1.6;
      resize: none;
      font-family: inherit;
    }
    
    .editor-footer {
      padding: 10px 18px calc(10px + var(--safe-bottom));
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    
    /* --- Action Sheet Modal --- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    
    .action-sheet {
      width: 100%;
      max-width: 500px;
      background: var(--bg-surface);
      border-top-left-radius: var(--radius-lg);
      border-top-right-radius: var(--radius-lg);
      padding: 20px 20px calc(20px + var(--safe-bottom));
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .modal-overlay.active .action-sheet {
      transform: translateY(0);
    }
    
    .sheet-handle {
      width: 36px;
      height: 4px;
      background: var(--border-color);
      border-radius: 2px;
      margin: 0 auto 12px;
    }
    
    .sheet-btn {
      width: 100%;
      padding: 13px 16px;
      font-size: 0.95rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      border: none;
      background: var(--bg-primary);
      color: var(--text-main);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background 0.15s ease;
    }
    
    .sheet-btn:active {
      background-color: var(--border-color);
    }
    
    .sheet-btn.danger {
      color: var(--danger);
    }
    
    /* --- Simple Prompt Dialog Modal --- */
    .dialog-content {
      width: 90%;
      max-width: 380px;
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin: auto;
      box-shadow: var(--shadow-float);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    
    .dialog-content h3 {
      font-size: 1.1rem;
      font-weight: 700;
    }
    
    .dialog-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }
    
    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    
    /* Toast Notification */
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: #0f172a;
      color: #fff;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 200;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }
    
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>

<body>
  
  <div class="app-viewport">
    <!-- Header -->
    <header>
      <div class="header-left">
        <button id="backBtn" class="back-btn" aria-label="Back">
          <i data-lucide="chevron-left"></i>
        </button>
        <div class="brand-logo" id="brandLogo">
          <i data-lucide="notebook-pen"></i>
          <span>notes</span>
        </div>
        <div class="header-title" id="folderTitleDisplay" style="display: none;"></div>
      </div>
      
      <div class="header-actions">
        <button class="icon-btn" id="bulkExportBtn" title="Export Current View as ZIP">
          <i data-lucide="folder-archive"></i>
        </button>
      </div>
    </header>
    
    <!-- Search Section -->
    <div class="search-section">
      <div class="search-box">
        <i data-lucide="search" style="width: 18px; height: 18px;"></i>
        <input type="text" id="searchInput" placeholder="Search notes..." />
      </div>
    </div>
    
    <!-- Items List (Cards) -->
    <main id="itemList">
      <!-- Dynamically Rendered -->
    </main>
    
    <!-- Bottom Action Bar (Matches wireframe layout) -->
    <div class="bottom-bar" id="bottomBar">
      <button class="btn btn-secondary" id="addFolderBtn">
        <i data-lucide="folder-plus"></i> Add Folder
      </button>
      <button class="btn btn-primary" id="addNoteBtn">
        <i data-lucide="file-plus"></i> Add Note
      </button>
    </div>
  </div>
  
  <!-- Fullscreen Note Editor -->
  <div class="editor-screen" id="editorScreen">
    <div class="editor-header">
      <button class="icon-btn" id="closeEditorBtn">
        <i data-lucide="arrow-left"></i>
      </button>
      <div style="display: flex; gap: 8px;">
        <button class="icon-btn" id="exportTxtBtn" title="Export as .txt">
          <i data-lucide="download"></i>
        </button>
        <button class="btn btn-primary" id="saveNoteBtn" style="padding: 6px 14px; font-size: 0.85rem; height: 34px;">
          Done
        </button>
      </div>
    </div>
    <div class="editor-body">
      <input type="text" class="note-title-input" id="noteTitle" placeholder="Title" />
      <textarea class="note-content-input" id="noteContent" placeholder="Type your note here..."></textarea>
    </div>
    <div class="editor-footer">
      <span id="editorWordCount">0 words</span>
      <span id="editorLastSaved">Unsaved</span>
    </div>
  </div>
  
  <!-- Action Sheet Modal for 3-dots Menu -->
  <div class="modal-overlay" id="actionSheetModal">
    <div class="action-sheet">
      <div class="sheet-handle"></div>
      <button class="sheet-btn" id="sheetPinBtn">
        <i data-lucide="pin"></i> <span>Pin to Top</span>
      </button>
      <button class="sheet-btn" id="sheetRenameBtn">
        <i data-lucide="pencil"></i> <span>Rename</span>
      </button>
      <button class="sheet-btn" id="sheetExportBtn">
        <i data-lucide="download"></i> <span>Export File</span>
      </button>
      <button class="sheet-btn danger" id="sheetDeleteBtn">
        <i data-lucide="trash-2"></i> <span>Delete</span>
      </button>
    </div>
  </div>
  
  <!-- Custom Dialog Prompt Modal -->
  <div class="modal-overlay" id="dialogModal" style="align-items: center;">
    <div class="dialog-content">
      <h3 id="dialogTitle">Folder Name</h3>
      <input type="text" class="dialog-input" id="dialogInput" placeholder="Enter name..." />
      <div class="dialog-actions">
        <button class="btn btn-secondary" id="dialogCancelBtn" style="flex: 0; padding: 8px 16px;">Cancel</button>
        <button class="btn btn-primary" id="dialogConfirmBtn" style="flex: 0; padding: 8px 16px;">Save</button>
      </div>
    </div>
  </div>
  
  <!-- Toast Notification -->
  <div class="toast" id="toastMessage">Saved</div>
  
  <!-- Application Logic -->
  <script>
    /* ==========================================================================
       State Management & Storage
       ========================================================================== */
    const STORAGE_KEY = 'minimal_notes_app_data_v1';
    
    let state = {
      items: [], // Array of Note | Folder
      currentFolderId: null, // null = root directory
      searchQuery: '',
      activeItemForSheet: null,
      editingNoteId: null
    };
    
    function loadState() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        try {
          state.items = JSON.parse(data);
        } catch (e) {
          state.items = [];
        }
      } else {
        // Initial welcome data
        state.items = [
        {
          id: 'demo-folder-1',
          type: 'folder',
          title: 'Personal Ideas',
          parentId: null,
          pinned: false,
          updatedAt: new Date().toISOString()
        },
        {
          id: 'demo-note-1',
          type: 'note',
          title: 'Welcome to Minimal Notes 📝',
          content: 'This app is designed with a modern mobile-first UI.\n\nFeatures:\n- Add Folders and Notes\n- Export as TXT or ZIP\n- Pinned notes\n- Auto-saving & Local Storage',
          parentId: null,
          pinned: true,
          updatedAt: new Date().toISOString()
        }];
        saveState();
      }
    }
    
    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items));
    }
    
    /* ==========================================================================
       Utility Functions
       ========================================================================== */
    function formatDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const isToday = date.toDateString() === now.toDateString();
      
      const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (isToday) {
        return `Today, ${timeStr}`;
      }
      return `${date.toLocaleDateString([], { month: 'short', day: 'numeric' })}, ${timeStr}`;
    }
    
    function showToast(msg) {
      const toast = document.getElementById('toastMessage');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    function downloadFile(filename, blob) {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }
    
    /* ==========================================================================
       Render Engine
       ========================================================================== */
    const itemList = document.getElementById('itemList');
    const backBtn = document.getElementById('backBtn');
    const brandLogo = document.getElementById('brandLogo');
    const folderTitleDisplay = document.getElementById('folderTitleDisplay');
    const addFolderBtn = document.getElementById('addFolderBtn');
    
    function render() {
      // 1. Update Header Navigation State
      if (state.currentFolderId) {
        const currentFolder = state.items.find(i => i.id === state.currentFolderId);
        backBtn.style.display = 'block';
        brandLogo.style.display = 'none';
        folderTitleDisplay.style.display = 'block';
        folderTitleDisplay.textContent = currentFolder ? currentFolder.title : 'Folder';
        
        // Hide "Add Folder" button when inside folder view (Wireframe 2)
        addFolderBtn.style.display = 'none';
      } else {
        backBtn.style.display = 'none';
        brandLogo.style.display = 'flex';
        folderTitleDisplay.style.display = 'none';
        addFolderBtn.style.display = 'flex';
      }
      
      // 2. Filter & Sort Items
      let filtered = state.items.filter(item => {
        const matchesFolder = item.parentId === state.currentFolderId;
        const matchesSearch = state.searchQuery === '' ||
          item.title.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
          (item.content && item.content.toLowerCase().includes(state.searchQuery.toLowerCase()));
        
        // When searching, look across all items regardless of folder
        return state.searchQuery ? matchesSearch : matchesFolder;
      });
      
      // Sort: Pinned first, then by most recently updated
      filtered.sort((a, b) => {
        if (a.pinned === b.pinned) {
          return new Date(b.updatedAt) - new Date(a.updatedAt);
        }
        return a.pinned ? -1 : 1;
      });
      
      // 3. Render HTML
      itemList.innerHTML = '';
      
      if (filtered.length === 0) {
        itemList.innerHTML = `
          <div class="empty-state">
            <i data-lucide="${state.searchQuery ? 'search-x' : 'folder-open'}" style="width: 44px; height: 44px;"></i>
            <p>${state.searchQuery ? 'No matching notes found' : 'This folder is empty'}</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }
      
      filtered.forEach(item => {
        const isFolder = item.type === 'folder';
        const card = document.createElement('div');
        card.className = `item-card ${item.pinned ? 'pinned' : ''}`;
        
        // Compute preview description
        let previewText = '';
        if (isFolder) {
          const count = state.items.filter(i => i.parentId === item.id).length;
          previewText = `${count} ${count === 1 ? 'item' : 'items'}`;
        } else {
          previewText = item.content ? item.content.trim() : 'Empty note';
        }
        
        card.innerHTML = `
          <div class="card-top">
            <div class="card-info">
              <div class="card-title-row">
                <i data-lucide="${isFolder ? 'folder' : 'file-text'}" style="width: 18px; height: 18px; color: ${isFolder ? '#f59e0b' : 'var(--accent)'}; flex-shrink: 0;"></i>
                <span class="card-title">${escapeHtml(item.title || 'Untitled')}</span>
                ${item.pinned ? `<i data-lucide="pin" class="pin-badge"></i>` : ''}
              </div>
              <div class="card-preview">${escapeHtml(previewText)}</div>
            </div>
            <div class="card-actions">
              <button class="icon-btn card-menu-btn" data-id="${item.id}" title="Options">
                <i data-lucide="more-horizontal" style="width: 18px; height: 18px;"></i>
              </button>
            </div>
          </div>
          <div class="card-bottom-bar">
            <span class="card-meta-date">${formatDate(item.updatedAt)}</span>
            <span class="card-badge ${isFolder ? 'badge-folder' : 'badge-note'}">${isFolder ? 'Folder' : 'Note'}</span>
          </div>
        `;
        
        // Card Click Handler
        card.addEventListener('click', (e) => {
          if (e.target.closest('.card-menu-btn')) return;
          if (isFolder) {
            state.currentFolderId = item.id;
            render();
          } else {
            openEditor(item.id);
          }
        });
        
        // 3-dots Menu Button Click
        const menuBtn = card.querySelector('.card-menu-btn');
        menuBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openActionSheet(item);
        });
        
        itemList.appendChild(card);
      });
      
      lucide.createIcons();
    }
    
    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    
    /* ==========================================================================
       Editor Screen Interactions
       ========================================================================== */
    const editorScreen = document.getElementById('editorScreen');
    const noteTitleInput = document.getElementById('noteTitle');
    const noteContentInput = document.getElementById('noteContent');
    const editorWordCount = document.getElementById('editorWordCount');
    const editorLastSaved = document.getElementById('editorLastSaved');
    const closeEditorBtn = document.getElementById('closeEditorBtn');
    const saveNoteBtn = document.getElementById('saveNoteBtn');
    const exportTxtBtn = document.getElementById('exportTxtBtn');
    
    function openEditor(noteId = null) {
      state.editingNoteId = noteId;
      if (noteId) {
        const note = state.items.find(i => i.id === noteId);
        noteTitleInput.value = note.title;
        noteContentInput.value = note.content;
        editorLastSaved.textContent = `Saved ${formatDate(note.updatedAt)}`;
      } else {
        noteTitleInput.value = '';
        noteContentInput.value = '';
        editorLastSaved.textContent = 'Unsaved';
      }
      updateWordCount();
      editorScreen.classList.add('active');
    }
    
    function closeEditor() {
      saveActiveNote();
      editorScreen.classList.remove('active');
      render();
    }
    
    function updateWordCount() {
      const text = noteContentInput.value.trim();
      const words = text ? text.split(/\s+/).length : 0;
      editorWordCount.textContent = `${words} ${words === 1 ? 'word' : 'words'}`;
    }
    
    function saveActiveNote() {
      const title = noteTitleInput.value.trim() || 'Untitled Note';
      const content = noteContentInput.value;
      
      if (!state.editingNoteId && !noteTitleInput.value.trim() && !content.trim()) {
        return; // don't create empty notes
      }
      
      if (state.editingNoteId) {
        const note = state.items.find(i => i.id === state.editingNoteId);
        if (note) {
          note.title = title;
          note.content = content;
          note.updatedAt = new Date().toISOString();
        }
      } else {
        const newNote = {
          id: 'note_' + Date.now(),
          type: 'note',
          title: title,
          content: content,
          parentId: state.currentFolderId,
          pinned: false,
          updatedAt: new Date().toISOString()
        };
        state.items.unshift(newNote);
        state.editingNoteId = newNote.id;
      }
      saveState();
      editorLastSaved.textContent = `Saved ${formatDate(new Date())}`;
    }
    
    // Auto-save debounce on typing
    let autoSaveTimer;
    noteContentInput.addEventListener('input', () => {
      updateWordCount();
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(saveActiveNote, 600);
    });
    noteTitleInput.addEventListener('input', () => {
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(saveActiveNote, 600);
    });
    
    closeEditorBtn.addEventListener('click', closeEditor);
    saveNoteBtn.addEventListener('click', closeEditor);
    
    exportTxtBtn.addEventListener('click', () => {
      const title = (noteTitleInput.value.trim() || 'Untitled Note') + '.txt';
      const blob = new Blob([noteContentInput.value], { type: 'text/plain;charset=utf-8' });
      downloadFile(title, blob);
      showToast('Exported note as .txt');
    });
    
    /* ==========================================================================
       Action Sheet (3-Dots Menu)
       ========================================================================== */
    const actionSheetModal = document.getElementById('actionSheetModal');
    const sheetPinBtn = document.getElementById('sheetPinBtn');
    const sheetRenameBtn = document.getElementById('sheetRenameBtn');
    const sheetExportBtn = document.getElementById('sheetExportBtn');
    const sheetDeleteBtn = document.getElementById('sheetDeleteBtn');
    
    function openActionSheet(item) {
      state.activeItemForSheet = item;
      sheetPinBtn.querySelector('span').textContent = item.pinned ? 'Unpin' : 'Pin to Top';
      actionSheetModal.classList.add('active');
    }
    
    function closeActionSheet() {
      actionSheetModal.classList.remove('active');
      state.activeItemForSheet = null;
    }
    
    actionSheetModal.addEventListener('click', (e) => {
      if (e.target === actionSheetModal) closeActionSheet();
    });
    
    sheetPinBtn.addEventListener('click', () => {
      if (!state.activeItemForSheet) return;
      state.activeItemForSheet.pinned = !state.activeItemForSheet.pinned;
      saveState();
      closeActionSheet();
      render();
      showToast(state.activeItemForSheet.pinned ? 'Pinned to top' : 'Unpinned');
    });
    
    sheetRenameBtn.addEventListener('click', () => {
      const item = state.activeItemForSheet;
      closeActionSheet();
      openDialog(`Rename ${item.type === 'folder' ? 'Folder' : 'Note'}`, item.title, (newTitle) => {
        if (newTitle && newTitle.trim()) {
          item.title = newTitle.trim();
          item.updatedAt = new Date().toISOString();
          saveState();
          render();
          showToast('Renamed successfully');
        }
      });
    });
    
    sheetDeleteBtn.addEventListener('click', () => {
      const item = state.activeItemForSheet;
      if (!item) return;
      if (item.type === 'folder') {
        // Cascade delete child notes
        state.items = state.items.filter(i => i.id !== item.id && i.parentId !== item.id);
      } else {
        state.items = state.items.filter(i => i.id !== item.id);
      }
      saveState();
      closeActionSheet();
      render();
      showToast('Deleted');
    });
    
    sheetExportBtn.addEventListener('click', () => {
      const item = state.activeItemForSheet;
      if (!item) return;
      if (item.type === 'note') {
        const blob = new Blob([item.content || ''], { type: 'text/plain;charset=utf-8' });
        downloadFile(`${item.title || 'Untitled'}.txt`, blob);
        showToast('Exported note');
      } else {
        exportFolderAsZip(item);
      }
      closeActionSheet();
    });
    
    /* ==========================================================================
       Dialog Prompt Modal
       ========================================================================== */
    const dialogModal = document.getElementById('dialogModal');
    const dialogTitle = document.getElementById('dialogTitle');
    const dialogInput = document.getElementById('dialogInput');
    const dialogCancelBtn = document.getElementById('dialogCancelBtn');
    const dialogConfirmBtn = document.getElementById('dialogConfirmBtn');
    let dialogCallback = null;
    
    function openDialog(title, defaultValue, callback) {
      dialogTitle.textContent = title;
      dialogInput.value = defaultValue || '';
      dialogCallback = callback;
      dialogModal.classList.add('active');
      dialogInput.focus();
    }
    
    function closeDialog() {
      dialogModal.classList.remove('active');
      dialogCallback = null;
    }
    
    dialogCancelBtn.addEventListener('click', closeDialog);
    dialogConfirmBtn.addEventListener('click', () => {
      if (dialogCallback) dialogCallback(dialogInput.value);
      closeDialog();
    });
    
    /* ==========================================================================
       Folder & Bulk ZIP Exporters
       ========================================================================== */
    async function exportFolderAsZip(folder) {
      if (typeof JSZip === 'undefined') {
        showToast('ZIP library loading...');
        return;
      }
      const zip = new JSZip();
      const childNotes = state.items.filter(i => i.parentId === folder.id && i.type === 'note');
      
      if (childNotes.length === 0) {
        zip.file('README.txt', 'This folder is empty.');
      } else {
        childNotes.forEach(note => {
          zip.file(`${note.title.replace(/[/\\?%*:|"<>]/g, '-') || 'Note'}.txt`, note.content || '');
        });
      }
      
      const content = await zip.generateAsync({ type: 'blob' });
      downloadFile(`${folder.title.replace(/[/\\?%*:|"<>]/g, '-') || 'Folder'}.zip`, content);
      showToast('Folder exported as ZIP');
    }
    
    async function exportBulkViewAsZip() {
      if (typeof JSZip === 'undefined') return;
      const zip = new JSZip();
      const notes = state.items.filter(i => i.type === 'note');
      const folders = state.items.filter(i => i.type === 'folder');
      
      // Add loose notes in root
      notes.filter(n => !n.parentId).forEach(note => {
        zip.file(`${note.title.replace(/[/\\?%*:|"<>]/g, '-') || 'Note'}.txt`, note.content || '');
      });
      
      // Add folders & their notes
      folders.forEach(folder => {
        const folderZip = zip.folder(folder.title.replace(/[/\\?%*:|"<>]/g, '-'));
        const folderNotes = notes.filter(n => n.parentId === folder.id);
        folderNotes.forEach(n => {
          folderZip.file(`${n.title.replace(/[/\\?%*:|"<>]/g, '-') || 'Note'}.txt`, n.content || '');
        });
      });
      
      const content = await zip.generateAsync({ type: 'blob' });
      downloadFile('all-notes-backup.zip', content);
      showToast('All notes exported as ZIP');
    }
    
    /* ==========================================================================
       Event Listeners & Initialization
       ========================================================================== */
    document.getElementById('addNoteBtn').addEventListener('click', () => openEditor(null));
    
    document.getElementById('addFolderBtn').addEventListener('click', () => {
      openDialog('New Folder', '', (folderName) => {
        if (folderName && folderName.trim()) {
          const newFolder = {
            id: 'folder_' + Date.now(),
            type: 'folder',
            title: folderName.trim(),
            parentId: state.currentFolderId,
            pinned: false,
            updatedAt: new Date().toISOString()
          };
          state.items.unshift(newFolder);
          saveState();
          render();
          showToast('Folder created');
        }
      });
    });
    
    backBtn.addEventListener('click', () => {
      state.currentFolderId = null;
      render();
    });
    
    document.getElementById('bulkExportBtn').addEventListener('click', exportBulkViewAsZip);
    
    document.getElementById('searchInput').addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      render();
    });
    
    // Start App
    loadState();
    render();
  </script>
</body>

</html>
